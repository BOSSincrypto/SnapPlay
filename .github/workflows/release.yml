name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SNAPPLAY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snapplay-upload.jks"
      - name: Test and build signed release
        env:
          SNAPPLAY_KEYSTORE: ${{ runner.temp }}/snapplay-upload.jks
          SNAPPLAY_STORE_PASSWORD: ${{ secrets.SNAPPLAY_STORE_PASSWORD }}
          SNAPPLAY_KEY_ALIAS: ${{ secrets.SNAPPLAY_KEY_ALIAS }}
          SNAPPLAY_KEY_PASSWORD: ${{ secrets.SNAPPLAY_KEY_PASSWORD }}
        run: ./gradlew test lint assembleRelease bundleRelease --stacktrace
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab --verify-tag --generate-notes --title "SnapPlay $TAG"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/snapplay-upload.jks"
